<style>
:root{--bg:#09090c;--card:#14141a;--tx:#f2f2f5;--mut:#9a9aa8;--ac:#e62429;--gold:#f5c518;--bd:#2a2a33;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg) radial-gradient(ellipse at 50% -10%,#5a0d10 0,#1b0709 38%,var(--bg) 70%) fixed no-repeat;min-height:100vh}
main{max-width:680px;margin:0 auto;padding:16px}
.hero{text-align:center;padding:10px 0 14px;border-bottom:1px solid var(--bd);margin-bottom:14px}
.logo{display:inline-block;background:var(--ac);color:#fff;font:900 2.1rem/1 Impact,"Arial Narrow",sans-serif;letter-spacing:.12em;padding:6px 16px 4px;box-shadow:0 0 24px rgba(230,36,41,.55);transform:skewX(-6deg)}
h1{font:400 1.5rem/1.1 Impact,"Arial Narrow",sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:12px 0 6px;text-shadow:0 2px 12px rgba(230,36,41,.6)}
.sub{color:var(--mut);font-size:.85rem}
.bar{height:12px;background:#22222b;border-radius:3px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--bd)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--gold));box-shadow:0 0 14px rgba(245,197,24,.7);transition:width .4s}
#cnt{font:400 1rem Impact,"Arial Narrow",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin:8px 0 14px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
button,select{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:4px;padding:8px 12px;font:inherit;text-transform:uppercase;letter-spacing:.06em;font-size:.8rem}
button.on{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 14px rgba(230,36,41,.6)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:linear-gradient(100deg,#1d1d25,var(--card));border:1px solid var(--bd);border-left:4px solid var(--ac);border-radius:4px;padding:10px 12px;margin-bottom:9px;cursor:pointer;transition:transform .15s,box-shadow .15s}
li:active{transform:scale(.985)}
li.seen{border-left-color:var(--gold);box-shadow:0 0 16px rgba(245,197,24,.12)}
li.seen .t>:first-child,li.seen .t{color:var(--mut)}
.n{font:400 1.5rem Impact,"Arial Narrow",sans-serif;color:#3b3b47;width:2em;text-align:right}
li.seen .n{color:var(--gold)}
input{appearance:none;-webkit-appearance:none;width:24px;height:24px;border:2px solid #4a4a58;border-radius:50%;margin:0;flex:none;display:grid;place-content:center}
input:checked{background:linear-gradient(135deg,var(--gold),#c98f00);border-color:var(--gold);box-shadow:0 0 10px rgba(245,197,24,.7)}
input:checked::after{content:"✓";color:#111;font-weight:900;font-size:15px}
.t{flex:1;font-weight:600}
.m{font-size:.8rem;color:var(--mut);font-weight:400;margin-top:2px}
.tag{font-size:.65rem;border:1px solid var(--bd);border-radius:3px;padding:1px 6px;text-transform:uppercase;letter-spacing:.08em}
.tag.pe{color:var(--gold);border-color:rgba(245,197,24,.5)}.tag.se{color:#5ab0ff;border-color:rgba(90,176,255,.5)}
.inf{padding:2px 8px;font-size:.7rem;margin-left:4px}
.lore{font-size:.85rem;font-weight:400;margin-top:8px;color:#d6d6de;border-left:3px solid var(--gold);padding-left:8px;background:rgba(245,197,24,.05)}.lore[hidden]{display:none}

/* ===== Extra épico ===== */
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.65) 100%)}
main{position:relative;z-index:1}
h1{background:linear-gradient(180deg,#fff 30%,#f5c518 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;text-shadow:none;filter:drop-shadow(0 2px 10px rgba(230,36,41,.7))}
.logo{position:relative;overflow:hidden;animation:glow 3s ease-in-out infinite}
.logo::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes glow{0%,100%{box-shadow:0 0 18px rgba(230,36,41,.45)}50%{box-shadow:0 0 34px rgba(230,36,41,.9)}}
@keyframes shine{0%,55%{left:-60%}100%{left:130%}}
.bar i{background:linear-gradient(90deg,var(--ac),var(--gold),var(--ac));background-size:200% 100%;animation:flow 3s linear infinite}
@keyframes flow{to{background-position:-200% 0}}
.lore:not([hidden]){animation:drop .25s ease-out}
@keyframes drop{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
li{box-shadow:0 2px 10px rgba(0,0,0,.45)}
li:hover{border-color:#3d3d4a;box-shadow:0 0 18px rgba(230,36,41,.25)}
li.seen:hover{box-shadow:0 0 20px rgba(245,197,24,.3)}
button,select{transition:box-shadow .15s,background .15s}
button:active{transform:scale(.96)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
::selection{background:var(--ac);color:#fff}
*{scrollbar-width:thin;scrollbar-color:var(--ac) #111}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.ver{text-align:center;color:var(--mut);font-size:.7rem;letter-spacing:.15em;text-transform:uppercase;margin:18px 0 6px;opacity:.6}
</style>
</head>
